<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="title-bar">
      <h1>Blockly AI Agent</h1>
      <button id="closeBtn" class="close-btn" title="Close" aria-label="Close">×</button>
    </header>

    <div class="input-group">
      <label for="apiKey">Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="Enter API Key..." value="AIzaSyCcC7r8gGSSfnRCiP7BhfWqFgK6llIN6rI">
    </div>

    <div class="input-group">
      <div class="prompt-label-row">
        <label for="prompt">What should I build?</label>
        <select id="langSelect" class="lang-select" title="Language hint for voice recording (auto-detect if blank)">
          <option value="">🌐 Auto</option>
          <option value="he">🇮🇱 Hebrew</option>
          <option value="ar">🇸🇦 Arabic</option>
          <option value="ru">🇷🇺 Russian</option>
          <option value="fr">🇫🇷 French</option>
          <option value="de">🇩🇪 German</option>
          <option value="es">🇪🇸 Spanish</option>
          <option value="pt">🇵🇹 Portuguese</option>
          <option value="it">🇮🇹 Italian</option>
          <option value="zh">🇨🇳 Chinese</option>
          <option value="ja">🇯🇵 Japanese</option>
          <option value="ko">🇰🇷 Korean</option>
          <option value="tr">🇹🇷 Turkish</option>
          <option value="nl">🇳🇱 Dutch</option>
          <option value="pl">🇵🇱 Polish</option>
          <option value="uk">🇺🇦 Ukrainian</option>
        </select>
      </div>
      <div class="prompt-row">
        <textarea id="prompt" rows="3" placeholder="e.g. Display 'I am great' on the smartphone"></textarea>
        <button id="micBtn" class="mic-btn" title="Record voice prompt" aria-label="Record">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
      </div>
      <span id="sttStatus" class="stt-status"></span>
    </div>

    <button id="runBtn">Run Automation</button>
    <button id="testBtn" title="Executes a built-in sin-graph script directly, bypassing Gemini" style="margin-top:8px;">Run Test Script (no LLM)</button>

    <div id="status" class="status-box hidden">
      <p id="statusMsg"></p>
      <ul id="actionList"></ul>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
