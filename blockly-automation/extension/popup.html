<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="title-bar">
    <h1>Blockly AI Agent</h1>
    <div class="header-btns">
      <button id="gearBtn" class="icon-btn" title="API settings" aria-label="API settings">⚙</button>
      <button id="closeBtn" class="icon-btn close-btn" title="Close" aria-label="Close">×</button>
    </div>
  </header>

  <div id="apiPanel" class="api-panel hidden">
    <input type="password" id="apiKey" placeholder="Gemini API Key..." autocomplete="off">
  </div>

  <div id="chatHistory" class="chat-history"></div>

  <div class="bottom-bar">
    <div class="prompt-row">
      <select id="langSelect" class="lang-select" title="Language hint for voice recording (auto-detect if blank)">
        <option value="">🌐 Auto</option>
        <option value="he">🇮🇱 Hebrew</option>
        <option value="ar">🇸🇦 Arabic</option>
        <option value="ru">🇷🇺 Russian</option>
        <option value="fr">🇫🇷 French</option>
        <option value="de">🇩🇪 German</option>
        <option value="es">🇪🇸 Spanish</option>
        <option value="pt">🇵🇹 Portuguese</option>
        <option value="it">🇮🇹 Italian</option>
        <option value="zh">🇨🇳 Chinese</option>
        <option value="ja">🇯🇵 Japanese</option>
        <option value="ko">🇰🇷 Korean</option>
        <option value="tr">🇹🇷 Turkish</option>
        <option value="nl">🇳🇱 Dutch</option>
        <option value="pl">🇵🇱 Polish</option>
        <option value="uk">🇺🇦 Ukrainian</option>
      </select>
      <textarea id="prompt" rows="2" placeholder="What should I build?"></textarea>
      <button id="micBtn" class="mic-btn" title="Record voice prompt" aria-label="Record">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
    </div>
    <span id="sttStatus" class="stt-status"></span>
    <div class="action-row">
      <button id="sendBtn">Send</button>
      <button id="clearWsBtn" class="secondary-btn">Clear Workspace</button>
      <button id="testBtn" class="secondary-btn" title="Run built-in test script (no LLM)">Test</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
