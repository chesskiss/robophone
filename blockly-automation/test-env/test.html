<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blockly Executor Test</title>
  <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
  <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
  <script src="https://unpkg.com/blockly/msg/en.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; }

    /* ── toolbar ── */
    #toolbar {
      flex-shrink: 0; padding: 8px 14px; background: #1e293b;
      border-bottom: 1px solid #334155; display: flex; gap: 8px; align-items: center;
    }
    #toolbar h1 { font-size: 0.95rem; color: #0ea5e9; margin-right: 4px; }
    button {
      background: #4f46e5; color: white; border: none; padding: 6px 12px;
      border-radius: 5px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
    }
    button:hover { opacity: 0.85; }
    button.danger { background: #dc2626; }
    button.secondary { background: transparent; border: 1px solid #475569; color: #94a3b8; }
    button.secondary:hover { border-color: #0ea5e9; color: #f8fafc; }
    #statusBar {
      margin-left: auto; font-size: 0.72rem; padding: 4px 10px;
      background: #0f172a; border: 1px solid #1e293b; border-radius: 4px; min-width: 180px;
      color: #64748b;
    }
    #statusBar.ok  { color: #34d399; border-color: #059669; }
    #statusBar.err { color: #f87171; border-color: #dc2626; }

    /* ── main layout: test list | workspace | log ── */
    #main { flex: 1; display: flex; overflow: hidden; }

    /* test list */
    #testList {
      width: 230px; flex-shrink: 0; background: #0f172a;
      border-right: 1px solid #334155; display: flex; flex-direction: column; overflow: hidden;
    }
    #testList h2 {
      font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: #475569; padding: 8px 12px; border-bottom: 1px solid #1e293b; flex-shrink: 0;
    }
    #testList ul { list-style: none; overflow-y: auto; flex: 1; padding: 4px 0; }
    #testList li {
      padding: 9px 12px; cursor: pointer; border-left: 3px solid transparent;
      transition: background 0.12s;
    }
    #testList li:hover { background: #1e293b; }
    #testList li.active { background: #1e293b; border-left-color: #0ea5e9; }
    #testList li.done  { border-left-color: #059669; }
    #testList li.fail  { border-left-color: #dc2626; }
    .test-title { font-size: 0.78rem; font-weight: 600; color: #e2e8f0; }
    .test-meta  { font-size: 0.68rem; color: #64748b; margin-top: 2px; }
    .test-badge {
      display: inline-block; font-size: 0.6rem; padding: 1px 6px;
      border-radius: 99px; margin-top: 3px; font-weight: 700;
    }
    .badge-ok  { background: #064e3b; color: #34d399; }
    .badge-err { background: #7f1d1d; color: #fca5a5; }
    .badge-warn { background: #78350f; color: #fcd34d; }

    /* workspace */
    #blocklyDiv { flex: 1; height: 100%; }

    /* log panel */
    #logPanel {
      width: 300px; flex-shrink: 0; background: #1e293b;
      border-left: 1px solid #334155; display: flex; flex-direction: column; overflow: hidden;
    }
    #logPanel h2 {
      font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: #475569; padding: 8px 12px; border-bottom: 1px solid #334155; flex-shrink: 0;
    }
    #logOut {
      flex: 1; overflow-y: auto; padding: 8px 10px;
      font-family: 'SF Mono', monospace; font-size: 0.68rem; line-height: 1.6;
      color: #94a3b8; white-space: pre-wrap; word-break: break-all;
    }
    .log-ok   { color: #34d399; }
    .log-warn { color: #fcd34d; }
    .log-err  { color: #f87171; }
    .log-info { color: #94a3b8; }
  </style>
</head>
<body>

<div id="toolbar">
  <h1>Blockly Executor</h1>
  <button class="secondary" onclick="captureJson()">Capture JSON</button>
  <button class="danger secondary" onclick="clearWs()">Clear</button>
  <span id="statusBar">Select a test →</span>
</div>

<div id="main">
  <!-- ── Test list ── -->
  <div id="testList">
    <h2>Tests</h2>
    <ul id="testListUl"></ul>
  </div>

  <!-- ── Blockly workspace ── -->
  <div id="blocklyDiv"></div>

  <!-- ── Log panel ── -->
  <div id="logPanel">
    <h2>Execution Log</h2>
    <pre id="logOut">Run a test to see logs here.</pre>
  </div>
</div>

<!-- Blockly toolbox (needed to initialise workspace) -->
<xml id="toolbox" style="display:none">
  <category name="Logic"     colour="210">
    <block type="controls_if"></block><block type="logic_compare"></block>
    <block type="logic_operation"></block><block type="logic_negate"></block>
    <block type="logic_boolean"></block>
  </category>
  <category name="Loops"     colour="120">
    <block type="controls_for"></block><block type="controls_repeat_ext"></block>
    <block type="controls_whileUntil"></block>
  </category>
  <category name="Math"      colour="230">
    <block type="math_number"></block><block type="math_arithmetic"></block>
    <block type="math_single"></block><block type="math_trig"></block>
    <block type="math_round"></block><block type="math_random_int"></block>
    <block type="math_number_property"></block>
  </category>
  <category name="Text"      colour="160"><block type="text"></block></category>
  <category name="Lists"     colour="260">
    <block type="lists_create_empty"></block><block type="lists_create_with"></block>
    <block type="lists_getIndex"></block><block type="lists_setIndex"></block>
  </category>
  <category name="Variables" colour="330" custom="VARIABLE"></category>
  <category name="Functions" colour="290" custom="PROCEDURE"></category>
</xml>

  VAR_TOGGLE:                  'variables_set',
  VARIABLES_GET:               'variables_get',
  VARIABLES_SET:               'variables_set',
  MATH_CHANGE:                 'math_change',
  CONTROLS_FOR:                'controls_for',
  CONTROLS_IF:                 'controls_if',
  CONTROLS_REPEAT_EXT:         'controls_repeat_ext',
  CONTROLS_WHILEUNTILFOREVER:  'controls_whileUntil',
  CONTROLS_FLOW_STATEMENTS:    'controls_flow_statements',
  MATH_NUMBER:                 'math_number',
  MATH_ARITHMETIC:             'math_arithmetic',
  MATH_TRIG:                   'math_trig',
  MATH_SINGLE:                 'math_single',
  MATH_ROUND:                  'math_round',
  MATH_CONSTANT:               'math_constant',
  MATH_RANDOM_INT:             'math_random_int',
  MATH_RANDOM_FLOAT:           'math_random_float',
  MATH_NUMBER_PROPERTY:        'math_number_property',
  MATH_CONSTRAIN:              'math_constrain',
  LOGIC_COMPARE:               'logic_compare',
  LOGIC_BOOLEAN:               'logic_boolean',
  LOGIC_NEGATE:                'logic_negate',
  LOGIC_OPERATION_EXTENDED:    'logic_operation',
  LISTS_CREATE_EMPTY:          'lists_create_empty',
  LISTS_CREATE_WITH:           'lists_create_with',
  LISTS_LENGTH:                'lists_length',
  LISTS_ISEMPTY:               'lists_isEmpty',
  LISTS_GETINDEX:              'lists_getIndex',
  LISTS_SETINDEX:              'lists_setIndex',
  LISTS_SORT:                  'lists_sort',
  LISTS_SPLIT:                 'lists_split',
  MY_TEXT:                     'text',
  TEXT_JOIN:                   'text_join',
};

// Operator / value aliases
const OP_ALIASES = {
  '×': 'MULTIPLY', '÷': 'DIVIDE', '*': 'MULTIPLY', '/': 'DIVIDE',
  '+': 'ADD', '-': 'MINUS', '^': 'POWER', 'MODULO': 'MODULO',
  'sin': 'SIN', 'cos': 'COS', 'tan': 'TAN',
  'asin': 'ASIN', 'acos': 'ACOS', 'atan': 'ATAN',
};

function normalizeVal(v) { return OP_ALIASES[v] ?? v; }

// ─────────────────────────────────────────────────────────────────────────────
// Workspace setup
// ─────────────────────────────────────────────────────────────────────────────
const ws = Blockly.inject('blocklyDiv', {
  toolbox: document.getElementById('toolbox'),
  grid:   { spacing: 20, length: 3, colour: '#1e293b', snap: true },
  move:   { scrollbars: true, drag: true, wheel: true },
  zoom:   { controls: true, wheel: true, startScale: 0.85 },
  theme:  Blockly.Themes.Dark,
  renderer: 'zelos',
});

window.addEventListener('resize', () => Blockly.svgResize(ws));

// ─────────────────────────────────────────────────────────────────────────────
// Helpers
// ─────────────────────────────────────────────────────────────────────────────
function setStatus(msg, type = '') {
  const el = document.getElementById('statusBar');
  el.textContent = msg;
  el.className = type;
}

let logLines = [];
function appendLog(cls, msg) {
  logLines.push(`<span class="${cls}">${escHtml(msg)}</span>`);
  document.getElementById('logOut').innerHTML = logLines.join('\n');
  document.getElementById('logOut').scrollTop = 999999;
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function clearWs() {
  ws.clear();
  logLines = [];
  document.getElementById('logOut').innerHTML = 'Workspace cleared.';
  setStatus('Cleared');
  document.querySelectorAll('#testListUl li').forEach(li => li.classList.remove('active'));
}

function captureJson() {
  try {
    const json = Blockly.serialization.workspaces.save(ws);
    appendLog('log-info', '── Workspace JSON ──\n' + JSON.stringify(json, null, 2));
  } catch(e) {
    appendLog('log-err', 'JSON capture failed: ' + e.message);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Executor  — translates spawn/input commands into Blockly API calls
// ─────────────────────────────────────────────────────────────────────────────
function executeScript(commands) {
  const blockMap   = {};  // logicalId  → Blockly block (null = phantom)
  const valCursors = {};  // blockId    → next unfilled VALUE input index
  const statCursors= {};  // blockId    → next unfilled STATEMENT input index
  const fieldCursors={};  // blockId    → {fieldIdx, shadowInputIdx}

  let topY = 20;
  let placed = 0, warnings = 0, errors = 0;

  function valCur(id)  { if (!valCursors[id])  valCursors[id]  = 0; return valCursors; }
  function statCur(id) { if (!statCursors[id]) statCursors[id] = 0; return statCursors; }

  function mkBlock(type) {
    const b = ws.newBlock(type);
    b.initSvg();
    b.render();
    return b;
  }

  // Try to set a field on block b with value v.
  // Uses a per-block cursor so multiple `input` commands advance through fields in order.
  function applyInput(b, blockId, rawVal) {
    if (!fieldCursors[blockId]) fieldCursors[blockId] = { fi: 0, si: 0 };
    const fc = fieldCursors[blockId];
    const v = normalizeVal(rawVal);

    // Collect all editable fields in visual order
    const fields = [];
    for (const inp of b.inputList) {
      for (const f of inp.fieldRow) {
        if (f.name && !(f instanceof Blockly.FieldLabel)) fields.push({ block: b, field: f });
      }
    }
    // After direct fields, collect shadow block fields (for loop bounds etc.)
    const shadowFields = [];
    for (const inp of b.inputList) {
      if (!inp.connection) continue;
      const target = inp.connection.targetBlock();
      if (target && target.isShadow()) {
        for (const si of target.inputList) {
          for (const f of si.fieldRow) {
            if (f.name && !(f instanceof Blockly.FieldLabel))
              shadowFields.push({ block: target, field: f });
          }
        }
      }
    }

    const all = [...fields, ...shadowFields];

    if (fc.fi < all.length) {
      const { block: tb, field: f } = all[fc.fi++];
      try {
        tb.setFieldValue(v, f.name);
        appendLog('log-ok', `  input [${blockId}].${f.name} = "${v}"`);
        return true;
      } catch(e) {
        appendLog('log-warn', `  input [${blockId}].${f.name} = "${v}" FAILED: ${e.message}`);
        warnings++;
        return false;
      }
    } else {
      appendLog('log-warn', `  input [${blockId}] no field slot for "${v}" (cursor=${fc.fi})`);
      warnings++;
      return false;
    }
  }

  for (const cmd of commands) {
    // ── spawn ──────────────────────────────────────────────────────────────
    if (cmd.action === 'spawn') {
      const msgKey = cmd.block;
      let nativeType;

      if (msgKey in MSG_TO_TYPE) {
        nativeType = MSG_TO_TYPE[msgKey];
      } else {
        // Try lowercase as a fallback (e.g. "controls_for" already native)
        nativeType = msgKey.toLowerCase();
      }

      // Phantom block (INITIATE etc.)
      if (nativeType === null) {
        blockMap[cmd.id] = null;
        appendLog('log-info', `[phantom] ${msgKey} id=${cmd.id}`);
        continue;
      }

      let b;
      try {
        b = mkBlock(nativeType);
      } catch(e) {
        appendLog('log-err', `[spawn] unknown type "${nativeType}" (${msgKey}): ${e.message}`);
        errors++;
        if (cmd.id) blockMap[cmd.id] = null;
        continue;
      }

      // Connect to parent
      if (cmd.parent != null) {
        const parentBlock = blockMap[cmd.parent];

        if (parentBlock === null) {
          // Phantom parent — place as top-level block
          b.moveBy(20, topY);
          topY += 200;
        } else if (!parentBlock) {
          appendLog('log-warn', `[spawn] parent "${cmd.parent}" not found for ${cmd.id}`);
          b.moveBy(20, topY); topY += 200;
          warnings++;
        } else if (cmd.pos === 'next') {
          // Statement chain
          if (parentBlock.nextConnection && b.previousConnection) {
            try {
              parentBlock.nextConnection.connect(b.previousConnection);
            } catch(e) {
              appendLog('log-warn', `[spawn] next-connect ${cmd.id}: ${e.message}`);
              b.moveBy(20, topY); topY += 200; warnings++;
            }
          } else {
            appendLog('log-warn', `[spawn] ${cmd.id} pos=next but missing nextConnection or previousConnection`);
            b.moveBy(20, topY); topY += 200; warnings++;
          }
        } else {
          // Nested — positional socket fill
          if (b.outputConnection) {
            // VALUE block → fill next VALUE input on parent
            if (!valCursors[cmd.parent]) valCursors[cmd.parent] = 0;
            const valueInputs = parentBlock.inputList.filter(i => i.type === Blockly.INPUT_VALUE);
            const inp = valueInputs[valCursors[cmd.parent]];
            if (inp && inp.connection) {
              try {
                inp.connection.connect(b.outputConnection);
                valCursors[cmd.parent]++;
              } catch(e) {
                appendLog('log-warn', `[spawn] value-connect ${cmd.id} -> ${cmd.parent}[${valCursors[cmd.parent]}]: ${e.message}`);
                warnings++;
              }
            } else {
              appendLog('log-warn', `[spawn] no value-input slot [${valCursors[cmd.parent]}] on ${cmd.parent} for ${cmd.id}`);
              warnings++;
            }
          } else {
            // STATEMENT block → fill next STATEMENT input on parent
            if (!statCursors[cmd.parent]) statCursors[cmd.parent] = 0;
            let statInputs = parentBlock.inputList.filter(i => i.type === Blockly.NEXT_STATEMENT);

            // controls_if starts with only DO0; mutate to add else/elseif when needed
            if (statCursors[cmd.parent] >= statInputs.length && parentBlock.type === 'controls_if') {
              if (statCursors[cmd.parent] === 1 && parentBlock.elseCount_ === 0) {
                parentBlock.elseCount_ = 1;
              } else if (typeof parentBlock.elseifCount_ !== 'undefined') {
                parentBlock.elseifCount_ = (parentBlock.elseifCount_ || 0) + 1;
              }
              if (typeof parentBlock.updateShape_ === 'function') parentBlock.updateShape_();
              statInputs = parentBlock.inputList.filter(i => i.type === Blockly.NEXT_STATEMENT);
              appendLog('log-info', `  auto-mutated controls_if for ${cmd.id} (now ${statInputs.length} stat inputs)`);
            }

            const inp = statInputs[statCursors[cmd.parent]];
            if (inp && inp.connection) {
              try {
                inp.connection.connect(b.previousConnection);
                statCursors[cmd.parent]++;
              } catch(e) {
                appendLog('log-warn', `[spawn] stat-connect ${cmd.id} -> ${cmd.parent}[${statCursors[cmd.parent]}]: ${e.message}`);
                warnings++;
              }
            } else {
              appendLog('log-warn', `[spawn] no stat-input slot [${statCursors[cmd.parent]}] on ${cmd.parent} for ${cmd.id}`);
              warnings++;
            }
          }
        }
      } else {
        // No parent — top-level
        b.moveBy(20, topY);
        topY += 200;
      }

      if (cmd.id) blockMap[cmd.id] = b;
      placed++;
      appendLog('log-ok', `[spawn] ${msgKey} → ${nativeType} id=${cmd.id ?? '—'}`);

    // ── input ──────────────────────────────────────────────────────────────
    } else if (cmd.action === 'input') {
      const b = blockMap[cmd.block];
      if (!b) {
        appendLog('log-warn', `[input] target "${cmd.block}" not found`);
        warnings++;
        continue;
      }
      applyInput(b, cmd.block, cmd.value);

    // ── clear ──────────────────────────────────────────────────────────────
    } else if (cmd.action === 'clear') {
      ws.clear();
      topY = 20;
      appendLog('log-info', '[clear] workspace cleared');
    }
  }

  return { placed, warnings, errors, total: commands.length };
}

// ─────────────────────────────────────────────────────────────────────────────
// Run a test by index
// ─────────────────────────────────────────────────────────────────────────────
let activeIdx = null;

function runTest(idx) {
  const test = TESTS[idx];
  ws.clear();
  logLines = [];
  appendLog('log-info', `▶ ${test.title}`);
  appendLog('log-info', `  ${test.commands.length} commands`);
  appendLog('log-info', '─'.repeat(40));

  // Mark active in sidebar
  document.querySelectorAll('#testListUl li').forEach((li, i) => {
    li.classList.toggle('active', i === idx);
  });
  activeIdx = idx;

  const t0 = performance.now();
  let result;
  try {
    result = executeScript(test.commands);
  } catch(e) {
    appendLog('log-err', 'FATAL: ' + e.message);
    setStatus('✗ Fatal error', 'err');
    markListItem(idx, 'fail');
    return;
  }
  const ms = (performance.now() - t0).toFixed(1);
  const blockCount = ws.getAllBlocks(false).length;

  appendLog('log-info', '─'.repeat(40));
  appendLog(result.errors > 0 ? 'log-err' : result.warnings > 0 ? 'log-warn' : 'log-ok',
    `Done in ${ms}ms · placed=${result.placed} · workspace=${blockCount} blocks · warn=${result.warnings} · err=${result.errors}`);

  const statusCls = result.errors > 0 ? 'err' : '';
  setStatus(`✓ ${blockCount} blocks · ${ms}ms · warn:${result.warnings} err:${result.errors}`, statusCls);
  markListItem(idx, result.errors > 0 ? 'fail' : 'done');
}

function markListItem(idx, cls) {
  const li = document.querySelectorAll('#testListUl li')[idx];
  if (!li) return;
  li.classList.remove('done', 'fail');
  li.classList.add(cls);
  // update badge
  const badge = li.querySelector('.test-badge');
  if (badge) {
    badge.textContent = cls === 'done' ? '✓ passed' : '✗ errors';
    badge.className = 'test-badge ' + (cls === 'done' ? 'badge-ok' : 'badge-err');
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Build sidebar list
// ─────────────────────────────────────────────────────────────────────────────
const ul = document.getElementById('testListUl');
TESTS.forEach((t, i) => {
  const li = document.createElement('li');
  li.innerHTML = `
    <div class="test-title">${escHtml(t.title)}</div>
    <div class="test-meta">${escHtml(t.complexity)} · ${t.commands.length} cmds</div>
    <span class="test-badge" style="display:none"></span>`;
  li.addEventListener('click', () => runTest(i));
  ul.appendChild(li);
});
</script>
